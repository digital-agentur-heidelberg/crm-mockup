<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mailing – Heidelberg CRM</title>
  <link rel="stylesheet" href="../system/tokens.css">
  <link rel="stylesheet" href="../system/base.css">
  <link rel="stylesheet" href="../system/components.css">
  <script src="../system/vendor/lucide.js" defer></script>
  <script src="../system/shell.js" defer></script>
</head>
<body data-screen="mailings">
  <main class="screen" id="main">
    <a class="btn btn--quiet back-link" href="mailings.html"><i data-lucide="arrow-left" aria-hidden="true"></i>Zur Mailingübersicht</a>
    <div id="mailing-content"></div>
  </main>

  <script>
    window.addEventListener('load',()=>{
      const fixture=window.CrmShell.getMailingFixture(),params=new URLSearchParams(location.search),content=document.getElementById('mailing-content'),record=fixture.records.find(item=>item.id===params.get('id')),fixedMap={umweltwirtschaft:'environment',environment:'environment','unternehmen-aktiv':'companies',companies:'companies'},fixedDistribution=fixedMap[params.get('verteiler')],isNew=params.get('neu')==='1'||(!record&&!fixedDistribution);
      let selectedKey=record?record.distribution:fixedDistribution||null;
      const selectedDistribution=()=>selectedKey?fixture.distributions[selectedKey]:null;
      document.title=(record?record.title:isNew?'Mailing anlegen':'Mailing')+' – Heidelberg CRM';

      function previewMarkup(prefix,subject,office){
        return '<aside class="card preview-card" aria-labelledby="'+prefix+'-preview-title"><div class="preview-toolbar"><strong id="'+prefix+'-preview-title">So sieht es für Empfänger aus</strong><span id="'+prefix+'-preview-position">Stichprobe 1 von 5</span></div><div class="preview-recipient-nav"><button class="preview-nav-button" type="button" data-preview-previous aria-label="Vorherigen Empfänger zeigen"><i data-lucide="chevron-left" aria-hidden="true"></i></button><div class="recipient-meta"><strong data-preview-name>Petra Mildenberger</strong><small data-preview-org>Kultur- und Kreativwirtschaft Heidelberg</small></div><button class="preview-nav-button" type="button" data-preview-next aria-label="Nächsten Empfänger zeigen"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div><button class="preview-issue-jump" type="button" data-preview-problem><i data-lucide="triangle-alert" aria-hidden="true"></i><span>4 Beispiele mit leeren Bausteinen prüfen</span></button><div class="letter-shell"><div class="letter"><div class="letter-brand">Stadt Heidelberg</div><div class="letter-rule"></div><div class="preview-empty-warning" tabindex="-1" data-preview-warning hidden><i data-lucide="triangle-alert" aria-hidden="true"></i><span data-preview-warning-text></span></div><p><strong data-preview-salutation>Guten Tag Frau Mildenberger,</strong></p><p>wir informieren Sie mit diesem Mailing über <strong>'+subject+'</strong>. Sie erhalten diese Nachricht als Kontaktperson bei <strong data-preview-organisation>Kultur- und Kreativwirtschaft Heidelberg</strong>.</p><p>Bitte prüfen Sie die für Sie eingesetzten Angaben:<br><button class="preview-personal-link" type="button" data-preview-registration><i data-lucide="external-link" aria-hidden="true"></i><span>Persönliche Anmeldung öffnen</span></button></p><p class="letter-signoff">Freundliche Grüße<br><strong>Ihr '+office+'<br>Stadt Heidelberg</strong></p></div></div></aside>';
      }

      function bindPreview(root){
        let index=0,problemCursor=-1;const recipients=fixture.previewRecipients,problems=recipients.map((item,itemIndex)=>item.empty?itemIndex:-1).filter(itemIndex=>itemIndex>=0),warning=root.querySelector('[data-preview-warning]');
        function render(){const item=recipients[index],registration=root.querySelector('[data-preview-registration]');root.querySelector('[id$="-preview-position"]').textContent='Stichprobe '+(index+1)+' von '+recipients.length;root.querySelector('[data-preview-name]').textContent=item.name;root.querySelector('[data-preview-org]').textContent=item.organisation||'— Organisation fehlt';root.querySelector('[data-preview-salutation]').textContent=item.salutation;root.querySelector('[data-preview-organisation]').textContent=item.organisation||'[Organisation fehlt]';warning.hidden=!item.empty;root.querySelector('[data-preview-warning-text]').textContent=item.empty?item.empty+' leer: Der Echtversand müsste vor der Ausführung geklärt werden.':'';registration.disabled=item.empty==='Anmeldelink';window.CrmShell.rendered(root)}
        root.querySelector('[data-preview-previous]').addEventListener('click',()=>{index=(index-1+recipients.length)%recipients.length;render()});
        root.querySelector('[data-preview-next]').addEventListener('click',()=>{index=(index+1)%recipients.length;render()});
        root.querySelector('[data-preview-problem]').addEventListener('click',()=>{problemCursor=(problemCursor+1)%problems.length;index=problems[problemCursor];render();warning.focus()});
        root.querySelector('[data-preview-registration]').addEventListener('click',()=>window.CrmShell.showPrototypeNotice('action','Öffnen der persönlichen Anmeldung für '+recipients[index].name));render();
      }

      function exclusionRows(distribution,includeBoundary){
        let rows=distribution.exclusions.map(item=>'<tr><td><strong>'+item.name+'</strong></td><td>'+item.reason+'</td><td><span class="status status--warning">'+item.treatment+'</span></td></tr>').join('');
        if(includeBoundary){rows+='<tr><td><strong>'+fixture.crossOfficeRecipient.name+'</strong><br><small>'+fixture.crossOfficeRecipient.organisation+'</small></td><td>'+fixture.crossOfficeRecipient.explanation+'</td><td><span class="status status--info">nicht ausgeschlossen</span></td></tr>'}
        return rows;
      }

      function renderReadView(item){
        const distribution=fixture.distributions[item.distribution],locked=!distribution.editable,completed=item.completed,statusText=completed?'Abgeschlossen':'In Bearbeitung · lesbar, gesperrt';
        content.innerHTML='<header class="page-head"><div><p class="eyebrow">Mailing · Leseansicht</p><h1>'+item.title+'</h1><p>'+(completed?'Dieses Mailing wurde versendet. Seine Angaben bleiben unverändert nachlesbar.':'Dieses Mailing gehört zu einem sichtbaren Verteiler des Kulturamts und ist für Sie nicht bearbeitbar.')+'</p></div><span class="status '+(completed?'status--success':'status--info')+'"><i data-lucide="'+(completed?'circle-check':'lock-keyhole')+'" aria-hidden="true"></i>'+statusText+'</span></header>'+(locked?'<section class="protected-section" aria-labelledby="mailing-lock-title" aria-describedby="mailing-lock-reason"><div class="protected-section-head"><span class="protected-section-icon"><i data-lucide="lock-keyhole" aria-hidden="true"></i></span><div><strong id="mailing-lock-title">Mailing lesbar, Bearbeitung gesperrt</strong><p id="mailing-lock-reason">Der zugehörige Verteiler wird vom Kulturamt gepflegt. Änderungen nimmt das Kulturamt vor.</p></div></div><div class="protected-section-body"><p>Die sichtbaren Angaben bleiben vollständig lesbar; es werden keine deaktivierten Scheinfelder gezeigt.</p></div></section>':'')+'<div class="mail-grid"><div class="u-stack"><section class="card card-body"><h2>Angaben</h2><dl class="summary-list"><div><dt>Betreff</dt><dd>'+item.subject+'</dd></div><div><dt>Vorlage</dt><dd>'+fixture.template.name+'</dd></div><div><dt>Verteiler</dt><dd>'+distribution.name+'</dd></div><div><dt>Zuständiges Amt</dt><dd>'+distribution.office+'</dd></div><div><dt>Verantwortlich</dt><dd>'+item.responsible+'</dd></div><div><dt>Prozessstand</dt><dd>'+(completed?'Abgeschlossen · '+item.sentAt:'Schritt '+item.stage+' von 5')+'</dd></div><div><dt>Testnachweis</dt><dd>'+(item.testProof||'nicht dokumentiert')+'</dd></div></dl></section><section class="card card-body"><h2>Empfänger und Ausschlüsse</h2><dl class="summary-list"><div><dt>Mitglieder im Mailingbestand</dt><dd>'+distribution.members+'</dd></div><div><dt>Ausgeschlossen</dt><dd>'+distribution.excluded+'</dd></div><div><dt>Tatsächliche Empfänger</dt><dd>'+distribution.actual+'</dd></div></dl><div class="table-wrap"><table class="data-table data-table--static"><thead><tr><th scope="col">Person</th><th scope="col">Grund</th><th scope="col">Behandlung</th></tr></thead><tbody>'+exclusionRows(distribution,item.distribution==='environment'||item.distribution==='culture')+'</tbody></table></div></section>'+(completed?'<section class="receipt"><span class="status status--success"><i data-lucide="circle-check" aria-hidden="true"></i>Versand abgeschlossen</span><h2 class="receipt-title">Versandbeleg</h2><p>'+item.sentAt+' · '+item.responsible+'</p><div class="receipt-grid"><div><small>Belegnummer</small><strong>'+item.receipt+'</strong></div><div><small>Versendet</small><strong>'+distribution.actual+' E-Mails</strong></div><div><small>Ausgeschlossen</small><strong>'+distribution.excluded+' Kontakte</strong></div><div><small>Verteiler</small><strong>'+distribution.name+'</strong></div></div><button class="btn btn--compact receipt-download" type="button" data-prototype-action="Herunterladen des Versandbelegs '+item.receipt+'"><i data-lucide="download" aria-hidden="true"></i>Beleg herunterladen</button></section>':'')+'</div>'+previewMarkup('read',item.subject,distribution.office)+'</div>';
        bindPreview(content);window.CrmShell.rendered(content);
      }

      function renderProcess(){
        const initialStage=record?record.stage:1,fixed=Boolean(fixedDistribution),completedStages=new Set(),stageNames={1:'Vorlage',2:'Verteiler',3:'Inhalt und Empfänger',4:'Testversand',5:'Echtversand'};let currentStage=initialStage,testSkipped=false;
        for(let step=1;step<initialStage;step+=1){completedStages.add(step)}
        if(fixed){completedStages.add(2)}
        content.innerHTML='<header class="page-head"><div><p class="eyebrow">Mailing · Entwurf automatisch gespeichert</p><h1>'+(record?record.title:'Mailing anlegen')+'</h1><p>Sie sehen jederzeit, was entschieden ist, was nur angezeigt wird und wo der Entwurf endet.</p></div><button class="btn" type="button" data-toast="Der Mailing-Entwurf wurde gespeichert.">Entwurf speichern</button></header><ol class="process-steps" aria-label="Mailing-Prozess">'+[1,2,3,4,5].map(step=>'<li><button class="process-step" type="button" data-step="'+step+'"><span class="step-no">'+step+'</span><span><strong>'+stageNames[step]+'</strong><small data-step-meta="'+step+'">offen</small></span></button></li>').join('')+'</ol><div class="mail-grid"><section class="card mail-panel"><section class="mail-stage" data-stage="1" aria-labelledby="stage-1-title"><h2 id="stage-1-title" tabindex="-1">Vorlage</h2><p>Die Stelle im Ablauf ist sichtbar; ob Ämter künftig zwischen eigenen Vorlagen wählen, bleibt eine Fachfrage.</p><ul class="assignment-targets"><li><label class="assignment-target"><input type="radio" name="template" checked><span><strong>'+fixture.template.name+'</strong><small>'+fixture.template.scope+'</small></span><span class="status status--info">Gemeinsame Vorlage</span></label></li></ul><div class="button-row"><button class="btn" type="button" data-prototype-action="Auswahl einer anderen Mailingvorlage">Andere Vorlage auswählen</button><button class="btn btn--primary" type="button" data-next>Weiter</button></div></section><section class="mail-stage" data-stage="2" aria-labelledby="stage-2-title"><h2 id="stage-2-title" tabindex="-1">Verteiler</h2><div data-fixed-distribution hidden></div><div data-select-distribution><p>Wählen Sie genau einen Verteiler. Sichtbare Verteiler fremder Ämter bleiben lesbar, sind für die Testpersona aber gesperrt.</p><ul class="assignment-targets" data-distribution-targets></ul></div><div class="button-row"><button class="btn" type="button" data-previous>Zurück</button><button class="btn btn--primary" type="button" data-next data-distribution-next disabled>Weiter</button></div></section><section class="mail-stage" data-stage="3" aria-labelledby="stage-3-title"><h2 id="stage-3-title" tabindex="-1">Inhalt und Empfänger</h2><fieldset class="form-section"><legend>Inhalt</legend><div class="field"><label for="mail-subject">Betreff</label><input class="input" id="mail-subject" value="'+(record?record.subject:'Ihre Einladung: Branchendialog Kreativwirtschaft am 18. September')+'"></div><div class="field"><span class="field-title" id="mail-body-label">Nachricht</span><div class="merge-tools" role="toolbar" aria-label="Personalisierungsbausteine einfügen"><button class="merge-insert" type="button" data-token="Anrede">+ Anrede</button><button class="merge-insert" type="button" data-token="Vorname">+ Vorname</button><button class="merge-insert" type="button" data-token="Nachname">+ Nachname</button><button class="merge-insert" type="button" data-token="Organisation">+ Organisation</button><button class="merge-insert" type="button" data-token="Anmeldelink">+ Anmeldelink</button></div><div class="merge-editor" id="mail-body" contenteditable="true" role="textbox" aria-labelledby="mail-body-label" aria-multiline="true"><p><span class="merge-token" contenteditable="false">{{Anrede}}</span> <span class="merge-token" contenteditable="false">{{Nachname}}</span>,</p><p>gerne laden wir Sie zum Branchendialog Kreativwirtschaft ein. Sie erhalten diese Einladung als Kontaktperson bei <span class="merge-token" contenteditable="false">{{Organisation}}</span>.</p><p>Bitte melden Sie sich über <span class="merge-token" contenteditable="false">{{Anmeldelink}}</span> an.</p></div><div class="token-rules"><strong>Leere Bausteine: So wird verfahren</strong><div class="token-rule-groups"><section class="token-rule-group token-rule-group--auto"><h3><i data-lucide="circle-check" aria-hidden="true"></i>Automatisch gelöst</h3><dl class="token-rule-list"><div><dt>Anrede</dt><dd>„Guten Tag“</dd></div><div><dt>Vorname</dt><dd>entfällt</dd></div></dl></section><section class="token-rule-group token-rule-group--stop"><h3><i data-lucide="triangle-alert" aria-hidden="true"></i>Vor Versand zu klären</h3><ul class="token-stop-list"><li>Nachname</li><li>Organisation</li><li>Anmeldelink</li></ul></section></div></div></div></fieldset><fieldset class="form-section"><legend>Empfänger und Ausschlüsse</legend><div data-audience-summary></div></fieldset><div class="button-row"><button class="btn" type="button" data-previous>Zurück</button><button class="btn btn--primary" type="button" data-next>Weiter zum Testversand</button></div></section><section class="mail-stage" data-stage="4" aria-labelledby="stage-4-title"><h2 id="stage-4-title" tabindex="-1">Testversand</h2><p>Prüfen Sie Personalisierung, Links und Darstellung. Der Testversand ist optional und blockiert Schritt 5 nicht.</p><div class="field"><label for="test-recipient">Test an</label><input class="input" id="test-recipient" value="julia.koenig@heidelberg.de"></div><p class="notice notice--warning"><i data-lucide="circle-dashed" aria-hidden="true"></i><span><strong>Noch kein Testnachweis</strong><br>Der Entwurf führt keinen Versand aus und erzeugt deshalb keinen Nachweis.</span></p><div class="button-row"><button class="btn" type="button" data-previous>Zurück</button><button class="btn" type="button" data-prototype-action="Testversand und Dokumentation des Testnachweises">Test senden und dokumentieren</button><button class="btn btn--primary" type="button" data-skip-test>Weiter ohne Testversand</button></div></section><section class="mail-stage" data-stage="5" aria-labelledby="stage-5-title"><h2 id="stage-5-title" tabindex="-1">Echtversand</h2><p class="notice notice--danger"><i data-lucide="shield-alert" aria-hidden="true"></i><span><strong>Der nächste Schritt wäre unwiderruflich.</strong><br>Im Entwurf wird kein Versand ausgeführt.</span></p><dl class="summary-list"><div><dt>Vorlage</dt><dd>'+fixture.template.name+'</dd></div><div><dt>Verteiler</dt><dd data-final-distribution>noch nicht gewählt</dd></div><div><dt>Tatsächliche Empfänger</dt><dd data-final-recipients>—</dd></div><div><dt>Ausgeschlossen</dt><dd data-final-excluded>—</dd></div><div><dt>Testnachweis</dt><dd data-final-test>nicht erbracht</dd></div></dl><label class="check"><input type="checkbox" data-send-confirm><span>Ich habe Empfängerkreis, Ausschlüsse und Vorschau abschließend geprüft.</span></label><div class="button-row"><button class="btn" type="button" data-previous>Zurück</button><button class="btn btn--primary" type="button" data-send-real data-prototype-action="Unwiderruflicher Echtversand dieses Mailings" disabled><i data-lucide="send" aria-hidden="true"></i>Jetzt unwiderruflich versenden</button></div></section></section>'+previewMarkup('process',record?record.subject:'Ihre Einladung: Branchendialog Kreativwirtschaft am 18. September',(selectedDistribution()||fixture.distributions.creative).office)+'</div>';
        if(fixed){
          const distribution=selectedDistribution(),context=document.createElement('section');
          context.className='assignment-context';context.setAttribute('aria-label','Festgelegter Verteiler');
          context.innerHTML='<strong>Festgelegter Verteiler</strong><p>'+distribution.name+' · '+distribution.office+' · aus dem Verteilerdetail übernommen</p>';
          content.querySelector('.process-steps').before(context);
        }
        const stepButtons=[...content.querySelectorAll('[data-step]')],stages=[...content.querySelectorAll('.mail-stage')],nextButtons=[...content.querySelectorAll('[data-next]')],fixedPanel=content.querySelector('[data-fixed-distribution]'),selectionPanel=content.querySelector('[data-select-distribution]'),targets=content.querySelector('[data-distribution-targets]'),distributionNext=content.querySelector('[data-distribution-next]');
        Object.values(fixture.distributions).filter(distribution=>['creative','environment','culture'].includes(distribution.id)).forEach(distribution=>{const item=document.createElement('li');item.innerHTML='<label class="assignment-target"><input type="radio" name="distribution" value="'+distribution.id+'" '+(distribution.editable?'':'disabled')+'><span><strong>'+distribution.name+'</strong><small>'+distribution.office+' · '+distribution.members+' Mitglieder</small></span><span class="status '+(distribution.editable?'status--success':'status--info')+'"><i data-lucide="'+(distribution.editable?'pencil':'lock-keyhole')+'" aria-hidden="true"></i>'+(distribution.editable?'Bearbeitbar':'Gesperrt')+'</span></label>';targets.appendChild(item)});
        function renderAudience(){const distribution=selectedDistribution(),summary=content.querySelector('[data-audience-summary]');if(!distribution){summary.innerHTML='<p class="notice notice--warning"><i data-lucide="triangle-alert" aria-hidden="true"></i><span>Wählen Sie in Schritt 2 zuerst einen Verteiler.</span></p>';return}const includeBoundary=['environment','culture'].includes(distribution.id);summary.innerHTML='<dl class="summary-list"><div><dt>Mitglieder im Mailingbestand</dt><dd>'+distribution.members+'</dd></div><div><dt>Eindeutige Adressen in diesem Mailing</dt><dd>'+distribution.members+'</dd></div><div><dt>Ausgeschlossen</dt><dd>'+distribution.excluded+'</dd></div><div><dt>Tatsächliche Empfänger</dt><dd>'+distribution.actual+'</dd></div></dl><div class="table-wrap"><table class="data-table data-table--static"><thead><tr><th scope="col">Person</th><th scope="col">Grund</th><th scope="col">Behandlung</th></tr></thead><tbody>'+exclusionRows(distribution,includeBoundary)+'</tbody></table></div>';content.querySelector('[data-final-distribution]').textContent=distribution.name;content.querySelector('[data-final-recipients]').textContent=distribution.actual;content.querySelector('[data-final-excluded]').textContent=distribution.excluded;window.CrmShell.rendered(summary)}
        function reflectSteps(){stepButtons.forEach(button=>{const step=Number(button.dataset.step),meta=button.querySelector('[data-step-meta]'),index=button.querySelector('.step-no');button.classList.toggle('is-done',completedStages.has(step)&&!(step===4&&testSkipped));index.textContent=completedStages.has(step)&&!(step===4&&testSkipped)?'✓':step;if(step===currentStage){button.setAttribute('aria-current','step');meta.textContent='aktiv'}else{button.removeAttribute('aria-current');meta.textContent=step===2&&fixed?'festgelegt':step===4&&testSkipped?'übersprungen':completedStages.has(step)?'erledigt':'offen'};if(step>=3){button.disabled=!selectedKey}})}
        function setStep(step,focus){currentStage=step;stages.forEach(stage=>stage.classList.toggle('is-active',Number(stage.dataset.stage)===step));reflectSteps();if(focus){const heading=content.querySelector('#stage-'+step+'-title');heading.focus();window.scrollTo(0,0)}}
        if(fixed){const distribution=selectedDistribution();selectionPanel.hidden=true;fixedPanel.hidden=false;fixedPanel.innerHTML='<section class="card card-body--compact"><span class="status status--success"><i data-lucide="circle-check" aria-hidden="true"></i>Aus Verteilerdetail festgelegt</span><h3>'+distribution.name+'</h3><p>'+distribution.office+' · '+distribution.kind+' · '+distribution.members+' Mitglieder</p><p>Der Verteiler kann hier nachgelesen, aber für dieses Mailing nicht gewechselt werden.</p></section>';distributionNext.disabled=false}
        if(selectedKey&&!fixed){const input=targets.querySelector('input[value="'+selectedKey+'"]');if(input){input.checked=true;distributionNext.disabled=false}}
        targets.addEventListener('change',event=>{if(!event.target.matches('input[name="distribution"]'))return;selectedKey=event.target.value;distributionNext.disabled=false;completedStages.add(2);renderAudience();reflectSteps()});
        stepButtons.forEach(button=>button.addEventListener('click',()=>setStep(Number(button.dataset.step),true)));
        nextButtons.forEach(button=>button.addEventListener('click',()=>{completedStages.add(currentStage);if(currentStage===1&&fixed){setStep(3,true)}else{setStep(Math.min(5,currentStage+1),true)}}));
        content.querySelectorAll('[data-previous]').forEach(button=>button.addEventListener('click',()=>{if(currentStage===3&&fixed){setStep(1,true)}else{setStep(Math.max(1,currentStage-1),true)}}));
        content.querySelector('[data-skip-test]').addEventListener('click',()=>{testSkipped=true;completedStages.delete(4);content.querySelector('[data-final-test]').textContent='nicht erbracht · Schritt 4 übersprungen';setStep(5,true)});
        content.querySelector('[data-send-confirm]').addEventListener('change',event=>{content.querySelector('[data-send-real]').disabled=!event.target.checked});
        content.querySelectorAll('.merge-insert').forEach(button=>button.addEventListener('click',()=>{content.querySelector('#mail-body').append(' {{'+button.dataset.token+'}} ')}));
        bindPreview(content);renderAudience();setStep(initialStage,false);window.CrmShell.rendered(content);
      }

      if(record&&(record.completed||!fixture.distributions[record.distribution].editable)){renderReadView(record)}else{renderProcess()}
    });
  </script>
  <!-- Design-Rationale: Die fünf vorhandenen Prozessrollen werden nach vorn vollständig erlebbar; abgeschlossene oder fremde Mailings wechseln bewusst in eine reine Leseansicht. Signature-Element ist die namentlich sichtbare, aber nicht automatisch aufgelöste ämterübergreifende Empfängerwiederholung; Test- und Echtversand enden sichtbar an der Entwurfsgrenze. -->
</body>
</html>
